version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries"
    schema: "sql/schema"
    gen:
      go:
        package: "database"
        out: "internal/database"
        overrides:
          - db_type: "pgtype.uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
