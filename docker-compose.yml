
services:
  db:
    image: postgres:latest
    container_name: personal_finance
    restart: always
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: personal_finance
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

volumes:
  postgres_data:
